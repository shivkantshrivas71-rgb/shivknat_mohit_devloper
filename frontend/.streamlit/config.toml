[theme]
base = "dark"
primaryColor = "#10a37f"
backgroundColor = "#212121"
secondaryBackgroundColor = "#171717"
textColor = "#ececec"
font = "sans serif"

[client]
toolbarMode = "minimal"
showErrorDetails = true

[browser]
gatherUsageStats = false

[server]
headless = true
port = 8501
address = "127.0.0.1"
enableXsrfProtection = false
