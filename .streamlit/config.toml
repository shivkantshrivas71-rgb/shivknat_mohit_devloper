[theme]
base = "dark"
primaryColor = "#00f2fe"
backgroundColor = "#090d16"
secondaryBackgroundColor = "#111827"
textColor = "#e2e8f0"
font = "sans serif"

[client]
toolbarMode = "minimal"
showErrorDetails = true

[browser]
gatherUsageStats = false

[server]
headless = true
enableCORS = false
enableXsrfProtection = false
